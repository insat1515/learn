<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <h1>Registration Form </h1>
</head>
<body>
    <fieldset>
         <legend><h3>Personal Profile</h3></legend>

    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        <br><br>
        
    </div>
    
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
   
    
    <label for="Date of birth"> Date of birth</label>
    <input type="date of birth" placeholder=" Enter date of birth"></input> 

    <p>Gender:</p>
    <input type="radio" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" name="gender" value="female">
    <label for="female">Female</label>
    <input type="radio" name="gender" value="other">
    <label for="other">Other</label>
    <br>
    <br>
     <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"><br><br>    
     <select name="Major" id="country">
             <option value="បាត់ដំបង">បាត់ដំបង</option>
            <option value="ភ្នំពេញ">ភ្នំពេញ</option>
            <option value="សៀមរាប">សៀមរាប</option>
            <option value="ព្រះវិហារ">ព្រះវិហារ</option>
            <option value="កំពត">កំពត</option>
    
        </select><br><br>
    </fieldset>
    <fieldset>
        <legend><h3>Academic information</h3></legend>
        <label for=" Student Id"> Student Id</label>
    <input type="Studebt id" placeholder=" Student Id"></input> 
    <br><br>
    <label for="">Major:</label>
        <select>
            <option>Select Major</option>
            <option>IT</option>
            <option>BM</option>
            <option>FN</option>
            <option>AD</option>
        </select>
        <br>
        <br>
        <label for="">Skills:</label>
        <input type="checkbox" name="Major">HTML
        <input type="checkbox" name="Major">CSS
        <br>
        <br>
            <label for="">Upload Photo:</label>
            <input type="file">
    </fieldset>
    <br><br>
    <fieldset style="border: 2px solid red;">
        <legend><h3>Additional Information</h3></legend>
        <label for="">Adress:</label><br>
        <textarea name="" rows="10" cols="40"></textarea>
        <br><br>
        <label for="">Personal Website:</label>
        <input type="text">
        <br><br>
        <label for="">Favorite Color:</label>
        <input type="color">
    </fieldset>
    <br><br>
    <input type="checkbox"> I agree to the registration terms.
    <br><br>
    <button type="submit">Register</button>
    <button type="submit">Clear Form</button>
</form>@2026 Thank you!
   

</body>
</html>
